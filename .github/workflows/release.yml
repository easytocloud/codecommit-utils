# .github/workflows/release.yml
# On every push to main, let semantic-release decide whether the commits since
# the last tag warrant a release. If they do, it tags and publishes one, and
# Homebrew Releaser then pushes the regenerated formula to the tap. If they do
# not, the run stops after semantic-release and nothing is published.
on:
  push:
    branches:
      - "main"


jobs:
  homebrew-releaser:
    runs-on: ubuntu-latest
    name: homebrew-releaser
    # Minimal permissions following principle of least privilege
    permissions:
      contents: write      # Required for creating releases and pushing to Homebrew tap
      id-token: write      # Required for SLSA provenance (future enhancement)
    # Security hardening
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      # Pin to SHA commit hash instead of mutable tag for supply chain security.
      # Dependabot updates these, but its runs against this repository are flaky:
      # it clones semantic-release-action and homebrew-releaser to check them and
      # its updater sometimes dies doing so, reporting unknown_error and leaving
      # those two out of the PR it opens. If a pin looks stale, check whether the
      # weekly run errored before assuming there is nothing newer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Load GitHub credentials from 1Password
        id: load-github-credentials
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c  # v4.1.1
        with:
          export-env: false
        env:
          # SECURITY: Service account token will be available to this step
          # Consider using ephemeral tokens for production
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: op://CICD/github-easytocloud-brew/credential

      - name: Semantic Release
        id: semantic
        # Held at v5 deliberately. v5 is the node24 release; v6 moves to
        # semantic-release 25, which is a major bump of the tool that tags our
        # releases and publishes the tap. Worth doing, but on its own, where a
        # bad release is easy to attribute - not bundled into a dependency PR.
        uses: cycjimmy/semantic-release-action@ba330626c4750c19d8299de843f05c7aa5574f62  # v5.0.2
        env:
          GH_TOKEN: ${{ steps.load-github-credentials.outputs.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Release codecommit-utils to easytocloud/homebrew-tap
        # Only run when semantic-release actually published a version. Otherwise
        # this regenerates the formula the tap already has, and its 'git commit'
        # fails with 'nothing to commit, working tree clean', failing the whole
        # run. That is why every push that cuts no release - a merge commit, a
        # chore or a docs change - has failed here.
        if: steps.semantic.outputs.new_release_published == 'true'
        # Held at v1.0.0 deliberately, despite v3.3.0 being available.
        #
        # v1 builds the action from a Dockerfile inside this pinned commit, so
        # the SHA above pins everything that runs. From v3 the action instead
        # pulls a pre-built image by mutable tag - v3.3.0 references
        # docker://justintime50/homebrew-releaser:3.2.1 - which can be moved
        # under us and defeats the point of pinning the action at all.
        #
        # What v3 buys is speed, ~30-60s against v1's ~120-200s. Our build of
        # this image takes ~12s, so that is a problem we do not have. Revisit if
        # v1 stops building or the tap needs something only v3 can do.
        uses: Justintime50/homebrew-releaser@8723315045b3b879065d4ce3e8ff143e6b958529  # v1.0.0
        with:
          # The name of the homebrew tap to publish your formula to as it appears on GitHub.
          # Required - strings.
          homebrew_owner: easytocloud
          homebrew_tap: homebrew-tap

          # The name of the folder in your homebrew tap where formula will be committed to.
          # Default is shown - string.
          formula_folder: Formula

          # The GitHub Token (saved as a repo secret) that has `repo` permissions for the homebrew tap you want to release to.
          # Required - string.
          github_token: ${{ steps.load-github-credentials.outputs.HOMEBREW_TAP_GITHUB_TOKEN  }}

          # Git author info used to commit to the homebrew tap.
          # Defaults are shown - strings.
          commit_owner: homebrew-releaser
          commit_email: homebrew-releaser@easytocloud.com

          # Custom dependencies in case other formulas are needed to build the current one.
          # Optional - multiline string.
          #depends_on: |
          #  "bash" => :build

          # Custom install command for your formula.
          # Required - string.
          install: |
            bin.install "distribution/bin/cch"
            bin.install "distribution/bin/ccclone"
            bin.install "distribution/bin/cclist"
            bin.install "distribution/bin/ccinit"
            man1.install "distribution/man/cch.1"
            man1.install "distribution/man/ccclone.1"
            man1.install "distribution/man/cclist.1"
            man1.install "distribution/man/ccinit.1"
            bash_completion.install "distribution/completions/cch-completion.bash"
            bash_completion.install "distribution/completions/ccclone-completion.bash"
            bash_completion.install "distribution/completions/cclist-completion.bash"
            zsh_completion.install "distribution/completions/_cch"
            zsh_completion.install "distribution/completions/_ccclone"
            zsh_completion.install "distribution/completions/_cclist"



          # Custom test command for your formula so you can run `brew test`.
          # These must not need AWS credentials or network access: cch derives
          # its version from the Cellar path it is installed into, and the help
          # output is printed without calling the AWS CLI. The man page check
          # catches an install block that stops shipping them.
          # Optional - string.
          test: |
            assert_match "cch #{version}", shell_output("#{bin}/cch --version")
            assert_match "Work with AWS CodeCommit repositories", shell_output("#{bin}/cch --help")
            assert_predicate man1/"cch.1", :exist?

          # Adds URL and checksum targets for different OS and architecture pairs. Using this option assumes 
          # a tar archive exists on your GitHub repo with the following URL pattern (this cannot be customized):
          # https://github.com/{GITHUB_OWNER}/{REPO_NAME}/releases/download/{TAG}/{REPO_NAME}-{VERSION}-{OPERATING_SYSTEM}-{ARCHITECTURE}.tar.gz'
          # Darwin AMD pre-existing path example: https://github.com/justintime50/myrepo/releases/download/v1.2.0/myrepo-1.2.0-darwin-amd64.tar.gz
          # Linux ARM pre-existing path example: https://github.com/justintime50/myrepo/releases/download/v1.2.0/myrepo-1.2.0-linux-arm64.tar.gz
          # Optional - booleans.
          #target_darwin_amd64: true
          #target_darwin_arm64: false
          #target_linux_amd64: true
          #target_linux_arm64: false

          # Update your homebrew tap's README with a table of all projects in the tap.
          # This is done by pulling the information from all your formula.rb files - eg:
          #
          # | Project                                    | Description  | Install                  |
          # | ------------------------------------------ | ------------ | ------------------------ |
          # | [formula_1](https://github.com/user/repo1) | helpful text | `brew install formula_1` |
          # | [formula_2](https://github.com/user/repo2) | helpful text | `brew install formula_2` |
          # | [formula_3](https://github.com/user/repo3) | helpful text | `brew install formula_3` |
          #
          # Simply place the following in your README or wrap your project in these comment tags:
          # <!-- project_table_start -->
          # TABLE HERE
          # <!--project_table_end -->
          #
          # Finally, mark `update_readme_table` as `true` in your GitHub Action config and we'll do the work of building a custom table for you.
          # Default is `false` - boolean.
          update_readme_table: true

          # Skips committing the generated formula to a homebrew tap (useful for local testing).
          # Default is shown - boolean.
          skip_commit: false

          # Logs debugging info to console.
          # Default is shown - boolean.
          debug: true
